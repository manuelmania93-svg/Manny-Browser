name: Manny Browser build

on:
  push:
    branches:
      - base/fulguris-stock
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Slions download debug APK
      run: ./gradlew assembleSlionsFullDownloadDebug
    - uses: actions/upload-artifact@v4
      with:
        name: manny-browser-debug
        path: app/build/outputs/apk/slionsFull/download/debug/
        if-no-files-found: error
