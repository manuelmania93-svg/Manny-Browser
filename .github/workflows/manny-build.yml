name: Manny Browser build

on:
  push:
    branches:
      - base/fulguris-stock
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Slions download debug APK
      run: ./gradlew assembleSlionsFullDownloadDebug
    - name: Locate built APK
      run: find app/build/outputs -name '*.apk' -exec ls -la {} +
    - uses: actions/upload-artifact@v4
      with:
        name: manny-browser-debug
        path: app/build/outputs/apk
        if-no-files-found: error

  smoke:
    name: Emulator install + launch test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manny-browser-debug
          path: apk
      - name: Stage APK at absolute path
        run: cp "$(find apk -name '*.apk' | head -1)" /tmp/app.apk && ls -la /tmp/app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            APK=$(find apk -name '*.apk' | head -1)
            echo "Installing $APK"
            adb install -r "$APK"
            adb shell monkey -p net.slions.fulguris.debug -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > /tmp/browser-launch.png
            adb logcat -d > /tmp/logcat.txt || true
            if grep -q "FATAL EXCEPTION" /tmp/logcat.txt; then echo "App crashed on first launch"; exit 1; fi
            echo "No crash; launch screenshot captured"
      - uses: actions/upload-artifact@v4
        with:
          name: manny-smoke-artifacts
          path: |
            /tmp/browser-launch.png
            /tmp/logcat.txt
          if-no-files-found: warn
