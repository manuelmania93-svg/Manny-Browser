name: Manny Browser development
on:
  push:
    branches: ['feat/manny-browser-v0.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable signing key
        env:
          MANNY_KEYSTORE_BASE64: ${{ secrets.MANNY_KEYSTORE_BASE64 }}
          MANNY_KEYSTORE_PASSWORD: ${{ secrets.MANNY_KEYSTORE_PASSWORD }}
          MANNY_KEY_ALIAS: ${{ secrets.MANNY_KEY_ALIAS }}
        run: |
          test -n "$MANNY_KEYSTORE_BASE64" && test -n "$MANNY_KEYSTORE_PASSWORD" && test -n "$MANNY_KEY_ALIAS"
          umask 077
          printf '%s' "$MANNY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/manny-signing.p12"
          echo "MANNY_KEYSTORE_PATH=$RUNNER_TEMP/manny-signing.p12" >> "$GITHUB_ENV"
          printf 'MANNY_KEYSTORE_PASSWORD=%s\n' "$MANNY_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'MANNY_KEY_ALIAS=%s\n' "$MANNY_KEY_ALIAS" >> "$GITHUB_ENV"
      # versionCode is stamped from the run number so every published build is strictly
      # newer than the last - the in-app updater compares versionCode, not versionName.
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PmannyVersionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Publish-script fixture tests
        run: bash .github/scripts/publish-release-test.sh
      - name: Remove runner signing-key copy
        if: always()
        run: rm -f "$RUNNER_TEMP/manny-signing.p12"
      - name: Inspect binary identity
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee badging.txt
          grep -q "package: name='app.mannybrowser'" badging.txt
          grep -q "application-label:'Manny Browser'" badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manny-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            badging.txt
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manny-debug-apk
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manny-runtime-evidence
          path: evidence/

  publish:
    name: Publish release
    # Gated automatic release on the exact head of the app's active branch. Merging
    # into feat/manny-browser-v0.1 still requires the user's explicit OK (standing
    # rule); this job only runs after such a merge. Dispatch runs never publish.
    # Nothing is ever deleted or overwritten (see .github/scripts/publish-release.sh).
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/manny-browser-v0.1'
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_CHECK_NAME: build
      EXPECTED_CERT_SHA256: 824edd962eaea53159fdd906ffac900d71c396c1b0964ee3fd6d8209a1ffc54f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;35.0.0
      - uses: actions/download-artifact@v4
        with:
          name: manny-debug-apk
          path: apk
      - name: Gate and publish
        run: bash .github/scripts/publish-release.sh apk/app-debug.apk
