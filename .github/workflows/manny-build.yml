name: Manny Browser build

on:
  push:
    branches:
      - base/fulguris-stock
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Slions download debug APK
      run: ./gradlew assembleSlionsFullDownloadDebug
    - name: Locate built APK
      run: find app/build/outputs -name '*.apk' -exec ls -la {} +
    - uses: actions/upload-artifact@v4
      with:
        name: manny-browser-debug
        path: app/build/outputs/apk
        if-no-files-found: error

  smoke:
    name: Emulator install + launch test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manny-browser-debug
          path: apk
      - name: Stage APK at absolute path
        run: |
          cp "$(find apk -name '*.apk' | head -1)" /tmp/app.apk && ls -la /tmp/app.apk
          cat > /tmp/fixture-prefs.xml <<'PREFS'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map>
              <boolean name="pref_key_accept_terms" value="true" />
              <boolean name="pref_key_analytics" value="false" />
              <boolean name="pref_key_crash_report" value="false" />
              <boolean name="pref_key_crash_logs" value="false" />
          </map>
          PREFS
          cat /tmp/fixture-prefs.xml
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: >-
            adb install -r /tmp/app.apk &&
            adb push /tmp/fixture-prefs.xml /data/local/tmp/fixture-prefs.xml &&
            adb shell run-as net.slions.fulguris.full.download.debug sh -c 'mkdir -p shared_prefs && cp /data/local/tmp/fixture-prefs.xml shared_prefs/net.slions.fulguris.full.download.debug_preferences.xml' &&
            adb shell am start -n net.slions.fulguris.full.download.debug/fulguris.activity.SplashActivity &&
            sleep 20 &&
            adb exec-out screencap -p > /tmp/browser-launch.png;
            [ -s /tmp/browser-launch.png ] || { echo "no launch screenshot captured - launch did not happen"; exit 1; };
            RESUMED=$(adb shell "dumpsys activity activities | grep ResumedActivity"); echo "$RESUMED";
            echo "$RESUMED" | grep -q "fulguris.activity\." || { echo "browser activity not resumed"; exit 1; };
            echo "$RESUMED" | grep -qi "leakcanary" && { echo "leakcanary resumed instead of browser"; exit 1; };
            echo "$RESUMED" | grep -q "IntroActivity" && { echo "intro still shown despite fixture prefs"; exit 1; };
            adb shell am start -a android.intent.action.VIEW -d https://example.com net.slions.fulguris.full.download.debug;
            sleep 18;
            R=$(adb shell "dumpsys activity activities | grep ResumedActivity"); echo "$R";
            echo "$R" | grep -q "IntroActivity" && { echo "intro regained foreground on VIEW"; exit 1; };
            adb exec-out screencap -p > /tmp/browser-page.png;
            [ -s /tmp/browser-page.png ] || { echo "no page screenshot captured"; exit 1; };
            adb shell am start -n net.slions.fulguris.full.download.debug/fulguris.activity.SettingsActivity;
            sleep 6;
            adb shell "dumpsys activity activities | grep ResumedActivity" | grep -q "SettingsActivity" || { echo "settings not resumed"; exit 1; };
            adb exec-out screencap -p > /tmp/browser-settings.png;
            [ -s /tmp/browser-settings.png ] || { echo "no settings screenshot captured"; exit 1; };
            adb logcat -d > /tmp/logcat.txt || true;
            if grep -q "FATAL EXCEPTION" /tmp/logcat.txt; then echo "App crashed"; exit 1; fi;
            echo "No crash; launch, page load and settings captured"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manny-smoke-artifacts
          path: |
            /tmp/browser-launch.png
            /tmp/browser-page.png
            /tmp/browser-settings.png
            /tmp/logcat.txt
          if-no-files-found: warn
