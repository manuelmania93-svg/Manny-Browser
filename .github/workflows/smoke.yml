name: Manny smoke (reuse build artifact)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run id whose manny-browser-debug artifact to smoke test'
        required: true
jobs:
  smoke:
    name: Emulator install + launch test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manny-browser-debug
          path: apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage APK at absolute path
        run: |
          APK=$(find apk -name '*.apk' | head -1)
          [ -z "$APK" ] && { echo "no APK found in artifact"; exit 1; }
          cp "$APK" /tmp/app.apk && ls -la /tmp/app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: >-
            adb install -r /tmp/app.apk &&
            adb shell am start -n net.slions.fulguris.full.download.debug/fulguris.activity.SplashActivity &&
            sleep 25 &&
            adb exec-out screencap -p > /tmp/browser-launch.png;
            [ -s /tmp/browser-launch.png ] || { echo "no launch screenshot captured - launch did not happen"; exit 1; };
            RESUMED=$(adb shell "dumpsys activity activities | grep ResumedActivity"); echo "$RESUMED"; echo "$RESUMED" | grep -q "fulguris.activity\." || { echo "browser activity not resumed"; exit 1; }; echo "$RESUMED" | grep -qi "leakcanary" && { echo "leakcanary resumed instead of browser"; exit 1; };
            adb shell input tap 181 262; sleep 3; adb shell input tap 181 262; sleep 3;
            adb shell am start -a android.intent.action.VIEW -d https://example.com net.slions.fulguris.full.download.debug;
            sleep 18;
            adb exec-out screencap -p > /tmp/browser-page.png;
            [ -s /tmp/browser-page.png ] || { echo "no page screenshot captured"; exit 1; };
            adb shell am start -n net.slions.fulguris.full.download.debug/fulguris.activity.SettingsActivity;
            sleep 6;
            adb shell "dumpsys activity activities | grep ResumedActivity" | grep -q "SettingsActivity" || { echo "settings not resumed"; exit 1; };
            adb exec-out screencap -p > /tmp/browser-settings.png;
            [ -s /tmp/browser-settings.png ] || { echo "no settings screenshot captured"; exit 1; };
            adb logcat -d > /tmp/logcat.txt || true;
            if grep -q "FATAL EXCEPTION" /tmp/logcat.txt; then echo "App crashed"; exit 1; fi;
            echo "No crash; launch, page load and settings captured"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manny-smoke-artifacts
          path: |
            /tmp/browser-launch.png
            /tmp/browser-page.png
            /tmp/browser-settings.png
            /tmp/logcat.txt
          if-no-files-found: warn
